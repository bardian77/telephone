id: exp04_photo_types
title: "Experiment 4: what survives for different kinds of photograph"
question: "Which attributes of a portrait, a street scene, a landscape, a text-heavy image and an abstract image die first?"
description: >
  The same detailed caption-and-regenerate chain run over all originals, grouped by the type
  prefix in the filename. The survival heatmap (field x generation, per type) is the result.
  Three repeats per image because the generator has no seed control.
images: ["data/originals/*.jpg", "data/originals/*.jpeg", "data/originals/*.png"]
generations: 12
seed: 7
repeats: 3
extractor: { provider: anthropic, model: claude-sonnet-5-5 }
variants:
  - name: detailed
    stations:
      - { kind: platform, params: { preset: instagram } }
      - { kind: caption, provider: anthropic, model: claude-sonnet-5-5, params: { mode: detailed } }
      - { kind: regenerate, provider: gemini, model: gemini-2.5-flash-image }
references:
  - "Trevor Paglen, Invisible Images (Your Pictures Are Looking at You) (2016)"
  - "Kate Crawford and Trevor Paglen, Excavating AI (2019)"
