id: exp07_screenshot_loop
title: "Experiment 7: screenshot and forward"
question: "If every pass is a screenshot that gets re-uploaded, so the picture is resampled each time, does the damage keep adding up?"
description: >
  Follow-up to experiment 1, still with no AI in the loop. In experiment 1 every pass re-uploaded
  the photo at a fixed size and quality; all the damage happened on the first pass and then the
  loop sat still. Pete Ashton's reposts were screenshots, so his picture was redrawn on a phone
  screen before every upload. Here every generation ends with one upload to Instagram (longest
  side 1080 px, JPEG quality 72) and the variants differ only in the step before it: no
  screenshot, a screenshot cropped exactly, or a screenshot cropped a few pixels off. The
  screenshot station scales the picture to fit a 1170 x 2532 phone screen and saves a PNG.
  Expectation: the reupload chain stops changing after the first few passes. If resampling is
  what makes the damage add up, the screenshot chains keep changing. SSIM to the previous
  generation shows whether and when each chain settles.
images: ["data/originals/*.jpg", "data/originals/*.jpeg", "data/originals/*.png"]
generations: 40
seed: 7
repeats: 1
extractor: { provider: anthropic, model: claude-sonnet-5-5 }
metrics: { clip: true, lpips: true }
variants:
  - name: reupload
    notes: "Control: experiment 1's Instagram chain. It should sit still after pass 1."
    stations:
      - { kind: platform, params: { preset: instagram } }
  - name: screenshot
    notes: "Screenshot with an exact crop, then upload. The picture is resampled every pass, the same way each time, and the framing is unchanged."
    stations:
      - { kind: screenshot, params: { crop_jitter_px: 0 } }
      - { kind: platform, params: { preset: instagram } }
  - name: screenshot_bilinear
    notes: "The same as screenshot, with the station's other way of resampling (bilinear in place of bicubic)."
    stations:
      - { kind: screenshot, params: { crop_jitter_px: 0, resample: bilinear } }
      - { kind: platform, params: { preset: instagram } }
  - name: screenshot_loose_crop
    notes: "Screenshot with a crop that is up to 6 px off on each edge, then upload. The picture is resampled every pass and the pixel grid shifts each time. The edges are slowly lost, so its distance-to-original numbers mix decay with reframing."
    stations:
      - { kind: screenshot, params: { crop_jitter_px: 6 } }
      - { kind: platform, params: { preset: instagram } }
references:
  - "Pete Ashton, I Am Sitting in Stagram (2015)"
  - "Hito Steyerl, In Defense of the Poor Image (2009)"
