id: exp07_screenshot_loop
title: "Experiment 7: screenshot and forward"
question: "If every pass is a screenshot that gets re-uploaded, so the picture is resampled each time, does the damage keep adding up?"
description: >
  Follow-up to experiment 1, still with no AI in the loop. In experiment 1 every pass re-uploaded
  the photo at a fixed size and quality; all the damage happened on the first pass and then the
  loop sat still. Pete Ashton's reposts were screenshots, so his picture was redrawn on a phone
  screen before every upload. Here every generation ends with one upload to Instagram (longest
  side 1080 px, JPEG quality 72) and the variants differ in the step before it: no screenshot, a
  screenshot cropped exactly (resampled in one of two ways), a screenshot cropped exactly on a
  different phone each pass, or a screenshot cropped a few pixels off. The screenshot station
  scales the picture to fit a phone screen (1170 x 2532 unless the variant says otherwise) and
  saves a PNG. Expectation: the reupload chain stops changing after the first few passes. If
  resampling is what makes the damage add up, the screenshot chains keep changing.

  In trial runs before the full run, the exact-crop chains stopped changing too, a little later
  than the control. A fixed step repeated seems to settle, whatever the step is. The many-phones
  variant was added to test the idea that follows from that: a loop only keeps decaying when
  something varies from pass to pass.

  A chain counts as settled from the first generation after which every generation's SSIM to the
  one before it is 1.000000, to six decimals, for at least three generations to the end of the
  run. One quiet pass in the middle is not settling: in the many-phones chain a phone the same
  size as the app changes nothing, and the next phone changes the picture again. Files that are
  the same byte for byte are not the test. In
  experiment 1's Instagram chain the lake and Seddon House photographs wrote a new file on all
  20 passes, although that number was 1.000000 from pass 5.

  SSIM in this project is measured on copies of the two pictures resized to 512 px wide, so
  loss of detail finer than that does not show in it. A small SSIM gap between two variants is
  therefore no evidence that the fine detail is intact, and "settled" means the picture has
  stopped changing at that scale. The measure to read for fine detail is "telephone detail-test
  exp07": it compares every generation at its own size with the same part of the original,
  resampled once, and it follows the crop, so for the loose-crop chain it tells lost detail
  apart from lost frame.

  How much an exact-crop screenshot costs depends on how the picture is resampled when it is
  drawn on the screen. The station offers bicubic and bilinear. How a real phone does it is not
  known, so the exact crop is run both ways, and each result belongs to its own way of
  resampling.

  The abstract crop is only 460 px wide. The screenshot step enlarges it to the width of the
  screen, as a phone would, and the upload then stores it 1080 px wide. The reupload control
  never enlarges it. So for this photograph the screenshot variants are not like for like with
  the control. It is reported on its own and left out of every per-variant average.
images: ["data/originals/*.jpg", "data/originals/*.jpeg", "data/originals/*.png"]
generations: 40
seed: 7
repeats: 1
extractor: { provider: anthropic, model: claude-sonnet-5-5 }
metrics: { clip: true, lpips: true }
variants:
  - name: reupload
    notes: >-
      Control: experiment 1's Instagram chain. It is expected to stop changing within the first
      few passes, and that is checked for every photograph with SSIM to the previous generation.
      In experiment 1's 20 passes five photographs got there by pass 5 and the 460 px abstract
      crop did not.
    stations:
      - { kind: platform, params: { preset: instagram } }
  - name: screenshot
    notes: >-
      Screenshot with an exact crop, then upload. The picture is resampled every pass, the same
      way each time (bicubic), and the framing does not change. The 460 px abstract crop is
      enlarged by the screenshot, so for it this chain is not like for like with the control.
    stations:
      - { kind: screenshot, params: { crop_jitter_px: 0 } }
      - { kind: platform, params: { preset: instagram } }
  - name: screenshot_bilinear
    notes: >-
      The same as screenshot with the station's other way of resampling, bilinear in place of
      bicubic, because how a real phone resamples is not known. The 460 px abstract crop is
      enlarged here too.
    stations:
      - { kind: screenshot, params: { crop_jitter_px: 0, resample: bilinear } }
      - { kind: platform, params: { preset: instagram } }
  - name: screenshot_loose_crop
    notes: >-
      Screenshot with a crop that is up to 6 px off on each edge, then upload. The picture is
      resampled every pass, the pixel grid shifts each time and the edges are slowly lost.
      ssim_to_g0 compares each generation with the uncropped original, so for this variant it
      measures the reframing and would be about the same if nothing had decayed.
      clip_dist_to_g0, hist_dist_to_g0 and lpips_to_g0 contain the reframing too and cannot
      separate it from decay. ssim_to_prev measures the change of crop from one pass to the
      next, so the settling test does not apply. What this variant loses apart from the
      reframing can only be read from a comparison that follows the crop. With one seed and one
      repeat every photograph gets the same crops, so the six chains are not six independent
      tries of the cropping. The 460 px abstract crop is enlarged by the screenshot here too.
    stations:
      - { kind: screenshot, params: { crop_jitter_px: 6 } }
      - { kind: platform, params: { preset: instagram } }
  - name: screenshot_many_phones
    notes: >-
      Screenshot with an exact crop on a different phone every pass, then upload. The screen
      sizes are typical phone screenshot sizes and are approximate; they stand for "a different
      phone each time". Which phone a pass gets is fixed by the seed and the pass number. The
      resampling changes from pass to pass and the framing does not, so this variant tests
      whether variation is what makes damage add up, without the reframing of the loose crop.
      On the 1080 px wide screen a picture that is already 1080 px wide is shown as it is, with
      no resampling. The 460 px abstract crop is enlarged here too.
    stations:
      - kind: screenshot
        params:
          crop_jitter_px: 0
          screens: [[1170, 2532], [1179, 2556], [1290, 2796], [1284, 2778], [1206, 2622], [1320, 2868], [1080, 2400], [1440, 3200]]
      - { kind: platform, params: { preset: instagram } }
references:
  - "Pete Ashton, I Am Sitting in Stagram (2015)"
  - "Hito Steyerl, In Defense of the Poor Image (2009)"
