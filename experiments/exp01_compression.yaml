id: exp01_compression
title: "Experiment 1: compression-only loop"
question: "How much does repeated platform recompression alone change a photograph, and do the metrics behave sensibly?"
description: >
  Baseline. Each generation is one simulated upload: resize to the platform's maximum edge,
  re-encode as JPEG at the platform's quality, strip metadata. No AI in the loop. Three presets
  of increasing severity. Expectation: SSIM falls then plateaus (JPEG converges to a fixed point),
  CLIP distance stays small, survival stays near 100%. If it does not, the metrics are wrong.
images: ["data/originals/*.jpg", "data/originals/*.jpeg", "data/originals/*.png"]
generations: 20
seed: 7
repeats: 1
extractor: { provider: anthropic, model: claude-sonnet-5-5 }
metrics: { clip: true, lpips: true }
variants:
  - name: instagram
    stations:
      - { kind: platform, params: { preset: instagram } }
  - name: whatsapp
    stations:
      - { kind: platform, params: { preset: whatsapp } }
  - name: harsh
    notes: "512px, quality 30: an exaggerated platform, to see where structure actually breaks"
    stations:
      - { kind: platform, params: { preset: harsh } }
  - name: screenshot_whatsapp
    notes: "Ashton's method: screenshot, then re-upload"
    stations:
      - { kind: platform, params: { preset: screenshot } }
      - { kind: platform, params: { preset: whatsapp } }
references:
  - "Pete Ashton, I Am Sitting in Stagram (2015)"
  - "Hito Steyerl, In Defense of the Poor Image (2009)"
